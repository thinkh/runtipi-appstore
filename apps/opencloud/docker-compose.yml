services:
  # Bind mounts are created as root, but OpenCloud runs as 1000:1000.
  # Hand the two top-level directories over before the server starts.
  opencloud-init:
    image: opencloudeu/opencloud:9.1.1
    user: '0:0'
    entrypoint:
      - /bin/sh
      - -c
      - chown 1000:1000 /etc/opencloud /var/lib/opencloud
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/opencloud
      - ${APP_DATA_DIR}/data/data:/var/lib/opencloud
    restart: 'no'

  opencloud:
    image: opencloudeu/opencloud:9.1.1
    user: '1000:1000'
    entrypoint:
      - /bin/sh
      - -c
      - |
        # OpenCloud's identity provider only accepts an https:// URL.
        # With a (local or public) domain, Traefik terminates TLS and OpenCloud
        # speaks plain HTTP behind it. Without a domain (Runtipi's default,
        # APP_PROTOCOL=http), OpenCloud serves HTTPS itself on its port with an
        # auto-generated self-signed certificate.
        if [ "$$APP_PROTOCOL" = "https" ]; then
          export PROXY_TLS=false
        else
          export PROXY_TLS=true
        fi
        # Must be the URL the browser uses: it is the OIDC issuer.
        export OC_URL="https://$$APP_DOMAIN"
        echo "OpenCloud URL: $$OC_URL (PROXY_TLS=$$PROXY_TLS)"
        # Writes opencloud.yaml with random secrets on the first start and fails
        # on every later start because the file exists (same as opencloud-compose).
        opencloud init || true
        exec opencloud server
    depends_on:
      opencloud-init:
        condition: service_completed_successfully
    environment:
      # Read by the entrypoint to derive OC_URL and PROXY_TLS.
      APP_PROTOCOL: ${APP_PROTOCOL}
      APP_DOMAIN: ${APP_DOMAIN}
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      # Skip certificate checks for self-signed certificates (*.tipi.local or
      # OpenCloud's own when no domain is set).
      OC_INSECURE: ${OPENCLOUD_INSECURE:-true}
      # Only read on the very first start; later changes are ignored.
      IDM_ADMIN_PASSWORD: ${OPENCLOUD_ADMIN_PASSWORD}
      IDM_CREATE_DEMO_USERS: 'false'
      PROXY_ENABLE_BASIC_AUTH: 'false'
      OC_DEFAULT_LANGUAGE: ${OPENCLOUD_DEFAULT_LANGUAGE:-en}
    # OpenCloud's own services fetch the OIDC config from OC_URL. Route the app's
    # hostname to the host's Traefik so this works without DNS for *.tipi.local
    # and without NAT loopback on the router.
    extra_hosts:
      - ${APP_HOST}:host-gateway
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/opencloud
      - ${APP_DATA_DIR}/data/data:/var/lib/opencloud
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 9200

x-runtipi:
  schema_version: 2
